name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: sarkari, POSTGRES_PASSWORD: sarkari, POSTGRES_DB: sarkari}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U sarkari" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgresql://sarkari:sarkari@localhost:5432/sarkari
      REDIS_URL: redis://localhost:6379/0
      SECURE_SSL_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: pytest -q
      - run: ruff check .
